[project]
name = "lateral-irrigator"
version = "0.1.0"
description = "Doover apps for monitoring and analysing lateral-move irrigators: an as-applied water-map widget (processor) plus brand-specific device apps."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydoover>=1.3.1",
    "transitions>=0.9.2",
]

[project.scripts]
# Valley lateral irrigator — device app (runs in a container via doover-app-run)
doover-app-run = "valley_lateral_irrigator:main"
export-config-valley = "valley_lateral_irrigator.app_config:export"
export-ui-valley = "valley_lateral_irrigator.app_ui:export"
# Lateral water map — processor / UI host for the as-applied map widget
export-config-watermap = "lateral_water_map.app_config:export"
export-ui-watermap = "lateral_water_map.app_ui:export"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lateral_water_map", "src/valley_lateral_irrigator"]

[dependency-groups]
dev = [
    "aiohttp>=3.11.18",
    "grpcio>=1.71.0",
    "protobuf>=6.30.2",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
    "requests>=2.32.3",
]
